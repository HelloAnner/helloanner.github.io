<!DOCTYPE html>
<html lang="zh-CN">
{{PARTIAL:head}}
<body>
  {{PARTIAL:hero}}
  {{PARTIAL:timeline}}
  {{PARTIAL:footer}}
  <script>
    const archive = document.getElementById('archive');
    function revealWork() {
      if (archive.contains(document.getElementById(location.hash.slice(1)))) archive.open = true;
    }
    window.addEventListener('hashchange', revealWork);
    revealWork();
    document.querySelectorAll('a[href^="#"]').forEach(link => {
      link.addEventListener('click', () => {
        if (archive.contains(document.getElementById(link.hash.slice(1)))) archive.open = true;
      });
    });
  </script>
</body>
</html>
