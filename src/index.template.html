<!DOCTYPE html>
<html lang="zh-CN">
{{PARTIAL:head}}
<body>
  {{PARTIAL:hero}}
  {{PARTIAL:timeline}}
  {{PARTIAL:footer}}
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 0 1 11.21 3a7 7 0 1 0 9.79 9.79z"></path></svg>
  </button>
  <script>
    /* theme: follow the OS theme by default; manual toggle stores an override */
    (() => {
      const root = document.documentElement;
      const mq = matchMedia("(prefers-color-scheme: dark)");
      const stored = localStorage.getItem("theme");
      if (stored ? stored === "dark" : mq.matches) root.classList.add("dark");
      mq.addEventListener("change", (e) => {
        if (!localStorage.getItem("theme")) root.classList.toggle("dark", e.matches);
      });
      const t = document.getElementById("theme-toggle");
      if (t) t.addEventListener("click", () => {
        root.classList.toggle("dark");
        localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
      });
    })();
    const archive = document.getElementById('archive');
    function revealWork() {
      if (archive.contains(document.getElementById(location.hash.slice(1)))) archive.open = true;
    }
    window.addEventListener('hashchange', revealWork);
    revealWork();
    document.querySelectorAll('a[href^="#"]').forEach(link => {
      link.addEventListener('click', () => {
        if (archive.contains(document.getElementById(link.hash.slice(1)))) archive.open = true;
      });
    });
  </script>
</body>
</html>
